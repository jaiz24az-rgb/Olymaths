<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.1" />
  <!-- Math symbols subtle background -->
  <text x="120" y="160" font-family="sans-serif" font-weight="900" font-size="52" fill="#93C5FD" opacity="0.5">+</text>
  <text x="360" y="160" font-family="sans-serif" font-weight="900" font-size="52" fill="#93C5FD" opacity="0.5">×</text>
  <text x="110" y="380" font-family="sans-serif" font-weight="900" font-size="52" fill="#93C5FD" opacity="0.5">÷</text>
  <text x="360" y="380" font-family="sans-serif" font-weight="900" font-size="52" fill="#93C5FD" opacity="0.5">=</text>
  <!-- Trophy / Star Center -->
  <path d="M256 120 L285 200 L370 200 L300 250 L325 330 L256 280 L187 330 L212 250 L142 200 L227 200 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="6" stroke-linejoin="round"/>
  <rect x="236" y="330" width="40" height="40" fill="#D97706" rx="4" />
  <rect x="200" y="370" width="112" height="28" rx="8" fill="#FBBF24" stroke="#B45309" stroke-width="4" />
  <text x="256" y="440" font-family="sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">KELAS 4</text>
</svg>
