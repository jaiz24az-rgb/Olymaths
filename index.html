    <script>
      (function() {
        // Suppress benign Vite HMR transport errors per environment guidelines
        function isViteHmrError(err, str) {
          var text = (str || '') + ' ' + (err?.message || '') + ' ' + (err?.stack || '');
          return (
            text.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            text.indexOf('WebSocket closed without opened') !== -1 ||
            text.indexOf('failed to connect to websocket') !== -1 ||
            (text.indexOf('[vite]') !== -1 && text.indexOf('websocket') !== -1) ||
            (text.indexOf('@vite/client') !== -1 && text.indexOf('connect') !== -1)
          );
        }

        window.addEventListener('unhandledrejection', function(e) {
          if (e && isViteHmrError(e.reason, String(e.reason || ''))) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (e && (isViteHmrError(e.error, e.message) || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var detail = (msg || '') + ' ' + (url || '') + ' ' + (error?.stack || '');
          if (isViteHmrError(error, detail)) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
        };

        var origConsoleError = console.error;
        console.error = function() {
          var fullMsg = Array.prototype.slice.call(arguments).map(function(item) {
            return item && item.stack ? item.stack : String(item);
          }).join(' ');
          if (isViteHmrError(null, fullMsg)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
